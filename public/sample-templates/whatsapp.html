<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>whatsapp — Floating WhatsApp button</title>
  <link rel="stylesheet" href="../template-base.css">
  <style>
    /* whatsapp: floating WhatsApp button. Bottom-right circle that
       sits over every other section (position: fixed). Click opens the
       configured wa.me link in a new tab.

       Position offset is 24px from bottom + right. If multiple widgets
       are added to the same site (WhatsApp + scroll-to-top + phone),
       they stack vertically — see the offset table in widgets-02 / 03 /
       04 for the agreed positions.

       Why no .fade-up class on the root: .fade-up applies a translateY
       transform which would create a containing block for any future
       position:fixed child. The widget IS the fixed element here so it
       doesn't matter, but keeping the root transform-free avoids
       surprises if widget internals ever need fixed children of their
       own. */
    /* SIZE / POSITION (Peter 2026-05-11):
       Anchored bottom-RIGHT. Compact 40px circle (was 56px) keeps the
       badge present without dominating the corner — Peter's "very very
       small" intent applied. Cookie bar (the ONLY left-side widget)
       lives on the opposite corner so they don't conflict. */
    .widget-whatsapp {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9990;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #25D366; /* WhatsApp brand green — fixed, NOT theme */
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.18);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .widget-whatsapp:hover {
      transform: scale(1.08);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      color: #fff;
    }
    .widget-whatsapp svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }
    @media (max-width: 600px) {
      .widget-whatsapp {
        bottom: 16px;
        right: 16px;
      }
    }
  </style>
</head>
<body>

<div class="preview-banner" style="position:fixed;top:0;left:0;right:0;background:#1c1917;color:#e7e5e4;padding:10px 16px;font-family:'DM Sans',sans-serif;font-size:13px;z-index:1000">
  <strong>TEMPLATE PREVIEW: whatsapp</strong> &nbsp; · &nbsp; Floating WhatsApp button bottom-right. Click opens wa.me URL in a new tab. &nbsp; · &nbsp;

<!-- Spacer so the widget doesn't sit at the very top of the viewport in standalone preview -->

  <p style="margin:0 0 8px;font-family:'Space Grotesk',sans-serif;font-weight:600;color:#1c1917">Floating widget preview</p>
  <p style="margin:0;font-size:0.9rem">The WhatsApp button sits fixed in the bottom-right of the viewport →</p>
</div>

<!--
  TEMPLATE: whatsapp
  LAYOUT:   Fixed-position circular button anchored bottom-right of the
            viewport (24px offset desktop, 16px mobile). Always visible,
            never scrolls with content, sits above all other sections via
            z-index 9990.
  CONTENT:  WhatsApp brand-green circle with the official WhatsApp glyph.
            The link href is the only configurable bit — type the phone
            number as plain digits (no wa.me URL prefix). The renderer
            auto-builds the wa.me/<intl-digits> URL on output (see
            parser.ts buildWhatsappHref). Composer shows a phone-style
            single number input — same UX as the phone-call widget.
  EDITABLE: 1 field — widget_whatsapp_url (link). Type the dial number
            as "07911234567" (local format, auto-prepended with the
            country code) or "+44 7911 234 567". Renderer outputs
            <a href="https://wa.me/447911234567"> regardless of which
            format you type. If you need a pre-filled message, you can
            still type the full URL form (`https://wa.me/447...?text=...`)
            and it passes through unchanged.
  THEME:    Brand green (#25D366) is FIXED — WhatsApp's identity is
            globally recognised, theming it would weaken the affordance.
            Drop shadow + scale-on-hover for tactile feedback.
  USE FOR:  Service businesses targeting SMB customers, many of whom
            prefer WhatsApp over phone calls or email forms. Pair with
            widgets-03 (phone-call button) for businesses that want both
            channels.
  NOTE:     WhatsApp is the ANCHOR of the right-column stack — always at
            bottom 24px (16px mobile). Phone-call and scroll-top are
            JS-aware of WhatsApp's presence and dynamically position
            themselves above it (or take the bottom slot themselves if
            WhatsApp isn't enabled). Cookie consent is a full-width strip
            and lives independently of the right-column stack.
-->
<a id="widget-whatsapp" class="widget-whatsapp" data-field="widget_whatsapp_url" data-type="link" href="tel:+15550000000" target="_blank" rel="noopener" aria-label="Message us on WhatsApp">
