<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>map-01 — Full-width Google Maps embed (map only)</title>
  <link rel="stylesheet" href="../template-base.css">
  <style>
    /* map-01: full-width Google Maps iframe, nothing else. The intent is
       a clean map block — no eyebrow, no heading, no card chrome. The
       editable map field uses data-type="map" which gives the composer a
       smart 3-mode input:
         - Address  (free text, Google geocodes — "1 High Street, London")
         - Coordinates  (lat,lng pair for exact pin — "48.1486,17.1077")
         - Embed       (paste a full Google Maps embed URL or iframe HTML)
       Whatever the user pastes is auto-detected by the composer — they
       pick whichever format matches what they have on hand.

       Earlier draft (v7, 2026-05-11 morning) added eyebrow / heading /
       address details / directions link on top of the map; reverted same
       day per Peter — he wanted map-01 to stay purely the map and pick
       map-03 (which has the floating card overlay) when text is needed. */
    .map-01 {
      width: 100%;
      height: 440px;
      line-height: 0;
      display: block;
      background: var(--color-bg-alt);
    }
    .map-01 iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    @media (max-width: 600px) {
      .map-01 { height: 360px; }
    }
  </style>
</head>
<body>

<div class="preview-banner" style="position:fixed;top:0;left:0;right:0;background:#1c1917;color:#e7e5e4;padding:10px 16px;font-family:'DM Sans',sans-serif;font-size:13px;z-index:1000">
  <strong>TEMPLATE PREVIEW: map-01</strong> &nbsp; · &nbsp; Full-width Google Maps embed only — no text, no card. The map field accepts address / coordinates / embed URL (auto-detected by composer). &nbsp; · &nbsp;
  <a href="../index.html" style="color:#e7e5e4">← back to template index</a>
</div>

<!-- SECTION:map:start -->
<!--
  TEMPLATE: map-01
  LAYOUT:   Full-width Google Maps iframe, 440px tall (360px on mobile).
            No text, no padding, no chrome. Pure map block.
  PLACEMENT: Between contact and footer, OR as a standalone "find us"
             block on a single-page site.
  CONTENT:  1 map iframe — that's the entire section.
  EDITABLE: 1 field — map_address. The data-type="map" tells the composer
            to render a 3-mode input (Address / Coordinates / Embed URL)
            with auto-detection from whatever the user pastes.
  EXAMPLES of acceptable values:
    Address:     "1 High Street, SW1A 1AA London"
    City:        "London, UK"
    Coordinates: "51.5074,-0.1278"     ← london center
    Embed URL:   "https://www.google.com/maps/embed?pb=…"
    Iframe HTML: "<iframe src=\"https://www.google.com/maps/embed?pb=…\">"
                 (composer extracts the src URL automatically)
  USE FOR:  When you want a clean map block with nothing else. If you
            need a heading, address card, hours, or a directions link
            with the map, use map-02 (split) or map-03 (overlay card).
-->
<div id="map" class="map-01">
  <iframe
    data-field="map_address"
    data-type="map"
    src="https://maps.google.com/maps?q=London%2C%20UK&t=&z=15&ie=UTF8&iwloc=B&output=embed"
    loading="lazy"
    referrerpolicy="no-referrer-when-downgrade"
    title="Map">
  </iframe>
</div>
<!-- SECTION:map:end -->

<div style="padding:80px 24px;background:#f5f3ee;text-align:center;color:#57534e;min-height:300px">
  <p style="margin:0 0 8px;font-family:'Space Grotesk',sans-serif;font-weight:600;color:#1c1917">Spacer area (preview-only)</p>
  <p style="margin:0;font-size:0.9rem">Grey block simulating page content below the map section.</p>
</div>

</body>
</html>
