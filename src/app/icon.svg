<?xml version="1.0" encoding="UTF-8"?>
<!--
  App favicon. Mirrors the BrandMark in src/components/brand.tsx:
  a solid brand-violet rounded tile with the brand initial in white.
  Brand color is the app brand token oklch(0.62 0.15 287), i.e. #8275db.
  White-label note: if BRAND_NAME or the brand color change in brand.tsx,
  update the letter and fill here to match (static asset, so it can't read
  those values at build time).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#8275db"/>
  <text x="32" y="46" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="600">A</text>
</svg>
